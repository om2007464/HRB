<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Raksha Bandhan 💕</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, #fff3c4 0 3%, transparent 4%),
        radial-gradient(circle at 80% 30%, #ffd6e0 0 4%, transparent 5%),
        linear-gradient(135deg, #fff5e6, #ffe1eb, #fff0c7);

      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b3048;
    }

    /* Decorative background */

    .decoration {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .flower {
      position: absolute;
      font-size: 2rem;
      animation: float 5s ease-in-out infinite;
      opacity: 0.75;
    }

    .f1 { top: 8%; left: 8%; }
    .f2 { top: 18%; right: 10%; animation-delay: 1s; }
    .f3 { bottom: 12%; left: 12%; animation-delay: 2s; }
    .f4 { bottom: 18%; right: 8%; animation-delay: 3s; }

    .sparkle {
      position: absolute;
      color: #d99b28;
      font-size: 1.4rem;
      animation: twinkle 2s infinite alternate;
    }

    .s1 { top: 15%; left: 30%; }
    .s2 { top: 28%; right: 25%; animation-delay: .5s; }
    .s3 { bottom: 20%; left: 28%; animation-delay: 1s; }
    .s4 { bottom: 30%; right: 30%; animation-delay: 1.5s; }

    /* Main card */

    .card {
      position: relative;
      z-index: 2;
      width: min(90%, 600px);
      padding: 55px 35px;
      text-align: center;

      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(12px);

      border: 2px solid rgba(255, 190, 100, 0.5);
      border-radius: 30px;

      box-shadow:
        0 25px 60px rgba(132, 70, 80, 0.18);

      animation: appear 1s ease;
    }

    .rakhi {
      font-size: 5rem;
      margin-bottom: 15px;
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: clamp(2.3rem, 7vw, 4.2rem);
      color: #c4486b;
      margin-bottom: 15px;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 1.15rem;
      line-height: 1.7;
      max-width: 450px;
      margin: auto;
      color: #704050;
    }

    .heart {
      margin: 25px 0;
      font-size: 1.8rem;
      letter-spacing: 8px;
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 50px;

      background: linear-gradient(135deg, #e85d83, #d94768);
      color: white;

      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;

      box-shadow: 0 8px 20px rgba(217, 71, 104, .3);
      transition: .25s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 25px rgba(217, 71, 104, .4);
    }

    #message {
      margin-top: 20px;
      min-height: 25px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #bd4263;
    }

    .footer {
      margin-top: 30px;
      font-size: .85rem;
      opacity: .65;
    }

    /* Animations */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }
      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes twinkle {
      from {
        opacity: .25;
        transform: scale(.8);
      }
      to {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Mobile */

    @media (max-width: 500px) {
      .card {
        padding: 45px 22px;
      }

      .rakhi {
        font-size: 4rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .flower {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="decoration">
    <div class="flower f1">🌸</div>
    <div class="flower f2">🌼</div>
    <div class="flower f3">🌺</div>
    <div class="flower f4">🌸</div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✧</div>
  </div>

  <main class="card">

    <div class="rakhi">🪢</div>

    <h1>Happy Raksha Bandhan!</h1>

    <p class="subtitle">
      Celebrating the beautiful bond of love, laughter,
      memories and always being there for each other. 💕
    </p>

    <div class="heart">
      ❤️ ✨ ❤️
    </div>

    <button onclick="sendLove()">
      Send Love ❤️
    </button>

    <p id="message"></p>

    <div class="footer">
      Made with love & a little bit of festive magic ✨
    </div>

  </main>

  <script>
    function sendLove() {
      const message = document.getElementById("message");

      message.textContent = "A little rakhi love has been sent! 🥰💖";

      // Tiny heart burst
      for (let i = 0; i < 12; i++) {
        const heart = document.createElement("span");

        heart.textContent = Math.random() > 0.5 ? "❤️" : "✨";

        heart.style.position = "fixed";
        heart.style.left = "50%";
        heart.style.top = "50%";
        heart.style.fontSize = "20px";
        heart.style.pointerEvents = "none";
        heart.style.zIndex = "10";

        document.body.appendChild(heart);

        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 180;

        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        heart.animate(
          [
            {
              transform: "translate(-50%, -50%) scale(1)",
              opacity: 1
            },
            {
              transform:
                `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.5)`,
              opacity: 0
            }
          ],
          {
            duration: 900,
            easing: "ease-out"
          }
        );

        setTimeout(() => heart.remove(), 900);
      }
    }
  </script>

</body>
</html>
